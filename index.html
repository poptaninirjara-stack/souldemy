<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SoulDemy: academic and professional English for college students. Quick games, phrase cards and lessons. Free, no account; progress stays on your device." />
    <meta name="theme-color" content="#FFF8EC" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>SoulDemy</title>
    <script>
      // Apply reduced motion before first paint so nothing animates by mistake.
      try {
        var r = matchMedia('(prefers-reduced-motion: reduce)').matches ||
          JSON.parse(localStorage.getItem('souldemy:v1:ui') || '""') === 'reduce'
        document.documentElement.dataset.motion = r ? 'reduced' : 'full'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
